# Global mongosh configuration for the dumbodb bats suite.
#
# forceDisableTelemetry turns off mongosh's client-side telemetry entirely for
# every invocation in the suite. It is loaded via
# MONGOSH_GLOBAL_CONFIG_FILE_FOR_TESTING (see helpers.bash) so no root or
# /etc/mongosh.conf is needed.
#
# It also sidesteps a mongosh 2.10.x packaging bug: cli-repl calls
# @mongosh/logging.getAiAgent() inside its forceDisableTelemetry getter, but the
# bundled logging package does not export it, so a non-interactive --eval in a
# container throws "getAiAgent is not a function" at shutdown and exits non-zero.
# forceDisableTelemetry is the first operand of that getter, so setting it true
# short-circuits before the missing call is reached.
mongosh:
  forceDisableTelemetry: true
