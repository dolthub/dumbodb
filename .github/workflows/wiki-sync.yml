name: Sync docs to wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

jobs:
  wiki-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Checkout wiki repo
        uses: actions/checkout@v4
        with:
          repository: dolthub/dumbodb.wiki
          path: wiki
          token: ${{ secrets.WIKI_SYNC_TOKEN }}

      - name: Build wiki pages
        run: |
          # Start clean (preserve .git)
          find wiki -mindepth 1 -not -path 'wiki/.git*' -delete

          # Home page: README with links rewritten for wiki context
          sed 's|docs/COMMANDS.md|Commands|g' README.md > wiki/Home.md

          # Command reference
          cp docs/COMMANDS.md wiki/Commands.md

          # Sidebar: simple navigation with command links
          cat > wiki/_Sidebar.md << 'SIDEBAR'
          ### Navigation
          - [[Home]]
          - [[Commands]]

          ### dolt* Commands
          - [[doltCommit|Commands#doltcommit]]
          - [[doltBranch|Commands#doltbranch]]
          - [[doltMerge|Commands#doltmerge]]
          - [[doltLog|Commands#doltlog]]
          - [[doltDiff|Commands#doltdiff]]
          - [[doltStatus|Commands#doltstatus]]
          - [[doltReset|Commands#doltreset]]
          - [[doltRevert|Commands#doltrevert]]
          - [[doltCherryPick|Commands#doltcherrypick]]
          - [[doltRebase|Commands#doltrebase]]
          - [[doltCurrentBranch|Commands#doltcurrentbranch]]
          - [[doltConflicts|Commands#doltconflicts]]
          - [[doltResolveConflict|Commands#doltresolveconflict]]
          SIDEBAR

      - name: Commit and push to wiki
        run: |
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to push to wiki."
          else
            git commit -m "docs: sync from main ($(git -C .. rev-parse --short HEAD))"
            git push
          fi
