name: Sync docs to wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'img/**'
  workflow_dispatch:

jobs:
  wiki-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v6

      - name: Checkout wiki repo
        uses: actions/checkout@v6
        with:
          repository: dolthub/dumbodb.wiki
          path: wiki
          token: ${{ secrets.WIKI_SYNC_TOKEN }}

      - name: Build wiki pages
        run: |
          # Start clean (preserve .git)
          find wiki -mindepth 1 -not -path 'wiki/.git*' -delete

          # Copy images
          cp -r img/ wiki/img/ 2>/dev/null || true

          # Home page: README with links rewritten for wiki context
          sed -e 's|docs/COMMANDS.md|Commands|g' \
              -e 's|\./img/|img/|g' \
              README.md > wiki/Home.md

          # Command reference
          cp docs/COMMANDS.md wiki/Commands.md

          # Sidebar: simple navigation with command links
          cat > wiki/_Sidebar.md << 'SIDEBAR'
          ### Navigation
          - [[Home]]
          - [[Commands]]

          ### Commands
          - [[dumboCommit|Commands#dumbocommit]]
          - [[dumboBranch|Commands#dumbobranch]]
          - [[dumboMerge|Commands#dumbomerge]]
          - [[dumboCherryPick|Commands#dumbocherrypick]]
          - [[dumboRebase|Commands#dumborebase]]
          - [[dumboLog|Commands#dumbolog]]
          - [[dumboStatus|Commands#dumbostatus]]
          - [[dumboDiff|Commands#dumbodiff]]
          - [[dumboReset|Commands#dumboreset]]
          - [[dumboRevert|Commands#dumborevert]]
          - [[dumboConflicts|Commands#dumboconflicts]]
          - [[dumboResolveConflict|Commands#dumboresolveconflict]]
          - [[dumboTag|Commands#dumbotag]]
          SIDEBAR

      - name: Commit and push to wiki
        run: |
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to push to wiki."
          else
            git commit -m "docs: sync from main ($(git -C .. rev-parse --short HEAD))"
            git push
          fi
