name: Sync docs to wiki

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'

jobs:
  wiki-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Checkout wiki repo
        uses: actions/checkout@v4
        with:
          repository: dolthub/dumbodb.wiki
          path: wiki
          token: ${{ secrets.WIKI_SYNC_TOKEN }}

      - name: Copy docs to wiki
        run: |
          # Remove everything except .git to start clean
          find wiki -mindepth 1 -not -path 'wiki/.git*' -delete

          # Copy docs/ content into the wiki root
          cp -r docs/. wiki/

          # Rename COMMANDS.md to Home.md so it becomes the wiki landing page
          if [ -f wiki/COMMANDS.md ] && [ ! -f wiki/Home.md ]; then
            cp wiki/COMMANDS.md wiki/Home.md
          fi

      - name: Commit and push to wiki
        run: |
          cd wiki
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to push to wiki."
          else
            git commit -m "docs: sync from main ($(git -C .. rev-parse --short HEAD))"
            git push
          fi
