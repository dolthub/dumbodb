name: Bats Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  bats:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install bats
        run: |
          sudo apt-get update -q
          sudo apt-get install -y bats

      - name: Install dolt
        run: |
          set -euo pipefail
          # Retry the download — install.sh is hosted on GitHub releases and
          # occasionally returns 5xx. Without pipefail, a curl failure here is
          # silently masked because the piped bash exits 0 on empty input,
          # leaving CI to discover the missing binary later as "dolt: command not found".
          for attempt in 1 2 3; do
            if sudo bash -c 'set -o pipefail; curl -fsSL https://github.com/dolthub/dolt/releases/latest/download/install.sh | bash'; then
              break
            fi
            echo "dolt install attempt $attempt failed; retrying..."
            sleep 5
          done
          dolt version

      - name: Install mongosh
        run: |
          wget -qO - https://www.mongodb.org/static/pgp/server-7.0.asc | sudo apt-key add -
          echo "deb [ arch=amd64,arm64 ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/7.0 multiverse" \
            | sudo tee /etc/apt/sources.list.d/mongodb-org-7.0.list
          sudo apt-get update -q
          sudo apt-get install -y mongodb-mongosh

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Run bats tests
        run: make bats
