name: Replication Parity

# The MongoDB secondary replication suite from dolthub/dumbodb-parity-testing.
#
# Separate from parity.yml because it is heavy: each case spawns its own
# multi-member replica set and the suite runs for most of an hour. It is gated
# on the replication code so unrelated changes do not pay for it, and it runs
# here rather than in the parity repository because the subject is this repo --
# a change here cannot trigger a workflow there.

on:
  push:
    branches: [main]
    paths:
      - "internal/replication/**"
      - "internal/handler/msg_replication*.go"
      - "internal/handler/msg_hello.go"
      - "internal/handler/msg_serverstatus.go"
      - ".github/workflows/replication.yml"
  pull_request:
    branches: [main]
    paths:
      - "internal/replication/**"
      - "internal/handler/msg_replication*.go"
      - "internal/handler/msg_hello.go"
      - "internal/handler/msg_serverstatus.go"
      - ".github/workflows/replication.yml"
  workflow_dispatch:

env:
  DUMBODB_NO_METRICS: "1"

jobs:
  replication:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.7"
          cache: true

      - name: Install mongod binary
        run: |
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/mongodb-server-8.0.gpg
          echo "deb [ signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] https://repo.mongodb.org/apt/ubuntu ${codename}/mongodb-org/8.0 multiverse" \
            | sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
          sudo apt-get update
          # 8.0.28 is the oracle the replication design document is written
          # against. The harness spawns its own replica sets from this binary.
          sudo apt-get install -y mongodb-org-server=8.0.28
          mongod --version

      - name: Build DumboDB
        run: |
          # make build, not go build: the Makefile sets the -ldflags version
          # stamp the binary reports through buildInfo.gitVersion. The harness
          # fails any run it cannot attribute to a commit, and a plain go build
          # reports "unknown".
          make build
          sudo cp .runtime/bin/dumbodb /usr/local/bin/dumbodb

          # Refuse an unattributable binary here rather than let it surface as a
          # confusing assertion failure later.
          reported=$(dumbodb --version | awk '{print $2}')
          echo "dumbodb reports: ${reported}"
          if [ -z "$reported" ] || [ "$reported" = "unknown" ]; then
            echo "dumbodb has no version stamp; results would not be attributable" >&2
            exit 1
          fi
          echo "### Subject: dumbodb \`${reported}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve parity-testing branch
        id: parity_ref
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ github.head_ref || github.ref_name }}
        run: |
          # A same-named branch in the parity repo lets a change to the suite
          # and a change to the subject be tested together.
          ref=main
          if [ -n "$CANDIDATE" ] && [ "$CANDIDATE" != "main" ] && \
             git ls-remote --exit-code --heads \
               "https://x-access-token:${GH_TOKEN}@github.com/dolthub/dumbodb-parity-testing.git" \
               "refs/heads/${CANDIDATE}" >/dev/null 2>&1; then
            ref="$CANDIDATE"
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "Using parity-testing ref: ${ref}"

      - name: Check out parity tests
        uses: actions/checkout@v6
        with:
          repository: dolthub/dumbodb-parity-testing
          ref: ${{ steps.parity_ref.outputs.ref }}
          path: parity-testing

      - name: Run replication suite
        working-directory: parity-testing
        env:
          MONGOD_BIN: /usr/bin/mongod
          DUMBODB_BIN: /usr/local/bin/dumbodb
        run: |
          set -o pipefail
          mkdir -p results
          # ./tests/replication/ is the whole point: the replication cases live
          # in their own package so this gate runs them and nothing else. The
          # build tag controls COMPILATION of those files, not selection, so
          # naming ./tests/ here would drag in the two thousand general parity
          # cases that already run in parity.yml. That mistake cost about seven
          # minutes a run and was invisible, because the suite passed either way.
          #
          # -parallel 4: each case owns an isolated replica set on random ports
          # under its own temp directory, so they cannot collide. Serial, the
          # suite took fifty three minutes.
          go test -tags replication ./harness/ ./tests/replication/ \
            -v -parallel 4 -timeout 40m -json | tee results/replication.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: replication-results
          path: parity-testing/results/
          if-no-files-found: ignore

      - name: Dump member logs on failure
        if: failure()
        run: |
          # The reason a subject stopped replicating is usually in its own log
          # and not in the test output. Every replication defect found so far
          # was diagnosed from these.
          for f in /tmp/dumbodb-member-*.log; do
            [ -f "$f" ] || continue
            echo "=============== $f ==============="
            tail -100 "$f"
          done
