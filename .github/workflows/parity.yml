name: Parity Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # CI-launched servers must not phone home; their SQL_SERVER boot events
  # would skew DoltHub's running-server metrics.
  DUMBODB_NO_METRICS: "1"

jobs:
  parity:
    runs-on: ubuntu-latest

    env:
      MONGO_URI: mongodb://localhost:27017
      DUMBODB_URI: mongodb://localhost:27018

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build DumboDB
        run: go build -o /usr/local/bin/dumbodb ./cmd/dumbodb

      # One mongod binary serves both the MONGO_URI reference server started
      # below and the auth pair and replica set the harness spawns. It comes
      # from MongoDB's apt repository rather than a container registry, whose
      # anonymous pull limits are shared across GitHub runner IPs.
      - name: Install mongod binary
        run: |
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/mongodb-server-8.0.gpg
          echo "deb [ signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] https://repo.mongodb.org/apt/ubuntu ${codename}/mongodb-org/8.0 multiverse" \
            | sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
          sudo apt-get update
          # Pinned to the MongoDB release DumboDB is tested against; keep in
          # sync with internal/version MongoDBVersion and the README. Bump
          # deliberately to a newer 8.0.x when adopting it.
          sudo apt-get install -y mongodb-org-server=8.0.28
          mongod --version

      # --fork returns only once mongod is accepting connections, and fails the
      # step if it cannot start. The port check below is a second, explicit
      # gate: the suite must never run against a missing reference server.
      - name: Start MongoDB
        run: |
          mkdir -p /tmp/mongod-data
          if ! mongod --port 27017 --bind_ip 127.0.0.1 --dbpath /tmp/mongod-data \
              --logpath /tmp/mongod.log --pidfilepath /tmp/mongod.pid --fork; then
            echo "mongod failed to start. Log:" >&2
            cat /tmp/mongod.log >&2
            exit 1
          fi
          if ! nc -z 127.0.0.1 27017; then
            echo "mongod reported started but is not listening on 27017. Log:" >&2
            cat /tmp/mongod.log >&2
            exit 1
          fi
          echo "MongoDB ready: $(mongod --version | head -1)"

      - name: Start DumboDB
        run: |
          dumbodb --port 27018 --data-dir /tmp/dumbodb-data > /tmp/dumbodb.log 2>&1 &
          echo $! > /tmp/dumbodb.pid

      - name: Wait for DumboDB to be ready
        run: |
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 27018 2>/dev/null; then
              echo "DumboDB ready"
              exit 0
            fi
            if ! kill -0 $(cat /tmp/dumbodb.pid) 2>/dev/null; then
              echo "DumboDB process died:" >&2
              cat /tmp/dumbodb.log >&2
              exit 1
            fi
            echo "Waiting for DumboDB ($i/30)..."
            sleep 2
          done
          echo "DumboDB did not start in time. Log:" >&2
          cat /tmp/dumbodb.log >&2
          exit 1

      # Prefer a parity-testing branch whose name matches this PR/push branch
      # (parallel PRs are usually developed on the same-named branch); fall
      # back to main when no such branch exists.
      - name: Resolve parity-testing branch
        id: parity_ref
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ github.head_ref || github.ref_name }}
        run: |
          ref=main
          if [ -n "$CANDIDATE" ] && [ "$CANDIDATE" != "main" ] && \
             git ls-remote --exit-code --heads \
               "https://x-access-token:${GH_TOKEN}@github.com/dolthub/dumbodb-parity-testing.git" \
               "refs/heads/${CANDIDATE}" >/dev/null 2>&1; then
            ref="$CANDIDATE"
            echo "Matching parity-testing branch found: ${CANDIDATE}"
          else
            echo "No matching parity-testing branch; using main"
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Check out parity tests
        uses: actions/checkout@v6
        with:
          repository: dolthub/dumbodb-parity-testing
          ref: ${{ steps.parity_ref.outputs.ref }}
          path: parity-testing

      - name: Run parity suite
        working-directory: parity-testing
        env:
          MONGOD_BIN: /usr/bin/mongod
          DUMBODB_BIN: /usr/local/bin/dumbodb
        run: |
          set -o pipefail
          mkdir -p results
          # Run the suite ONCE. -json feeds the results artifact and the failure
          # summary below; pipefail propagates go test's exit code through tee.
          # The suite used to run a second time for human-readable output, which
          # doubled load on the runner and the extra mongod instances the harness
          # spawns, causing flaky connection timeouts to the reference mongo.
          #
          # tests/tls needs no job of its own: it spawns its own mongod and
          # dumbodb per case from the two binaries already resolved above, and
          # ignores the long-running MONGO_URI and DUMBODB_URI servers entirely.
          go test ./tests/ ./tests/tls/ -v -timeout 20m -json | tee results/parity.json

      - name: Report parity failures
        if: failure()
        working-directory: parity-testing
        run: |
          fails=$(grep '"Action":"fail"' results/parity.json \
            | grep -oE '"Test":"[^"]+"' | sed 's/^"Test":"//; s/"$//' | sort -u)
          if [ -n "$fails" ]; then
            echo "Parity tests that failed:"
            echo "$fails"
          else
            echo "No test-level failures recorded; the suite or harness setup failed (see output above)."
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parity-results
          path: parity-testing/results/
          if-no-files-found: ignore
