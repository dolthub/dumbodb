name: Push Docker Image to DockerHub

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Released git tag to publish (e.g. v0.1.0). The tag must already exist on origin.'
        required: true
        type: string
      push_latest:
        description: 'Also tag and push as :latest'
        type: boolean
        default: true
  repository_dispatch:
    types: [ push-docker-image ]

permissions:
  contents: read

jobs:
  docker-image-push:
    name: Push Docker Image
    runs-on: ubuntu-22.04
    steps:
      - name: Resolve inputs
        id: inputs
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          DISPATCH_PUSH_LATEST: ${{ github.event.inputs.push_latest }}
          PAYLOAD_TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -euo pipefail

          if [ "${EVENT}" = "workflow_dispatch" ]; then
            git_tag="${DISPATCH_TAG}"
            push_latest="${DISPATCH_PUSH_LATEST}"
          else
            git_tag="${PAYLOAD_TAG}"
            push_latest="true"
          fi

          if [ -z "${git_tag}" ]; then
            echo "::error::tag is required (e.g. v0.1.0)"
            exit 1
          fi

          # Enforce the canonical v-prefixed MAJOR.MINOR.PATCH form so the tag we look up
          # exactly matches what the release workflow produced.
          if ! printf '%s' "${git_tag}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid tag '${git_tag}'. Must match vMAJOR.MINOR.PATCH (e.g. v0.1.0)"
            exit 1
          fi

          version="${git_tag#v}"
          tags="dolthub/dumbodb:${version}"
          if [ "${push_latest}" = "true" ]; then
            tags="${tags},dolthub/dumbodb:latest"
          fi

          {
            echo "git_tag=${git_tag}"
            echo "version=${version}"
            echo "tags=${tags}"
          } >> "${GITHUB_OUTPUT}"

      - name: Checkout at tag
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.inputs.outputs.git_tag }}
          fetch-depth: 0

      - name: Verify ref is a tag
        shell: bash
        env:
          GIT_TAG: ${{ steps.inputs.outputs.git_tag }}
        run: |
          set -euo pipefail
          if ! git tag -l "${GIT_TAG}" | grep -qx "${GIT_TAG}"; then
            echo "::error::Ref '${GIT_TAG}' is not a tag in this repository. Create and push it first: git tag ${GIT_TAG} && git push origin ${GIT_TAG}"
            exit 1
          fi

      - name: Verify release artifacts exist
        shell: bash
        env:
          GIT_TAG: ${{ steps.inputs.outputs.git_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The Dockerfile downloads these binaries; fail fast if the release hasn't published them yet.
          for arch in amd64 arm64; do
            url="https://github.com/${{ github.repository }}/releases/download/${GIT_TAG}/dumbodb-linux-${arch}"
            if ! curl -fsSLI -o /dev/null "${url}"; then
              echo "::error::Missing release artifact: ${url}. Run the Release Build workflow for ${GIT_TAG} first."
              exit 1
            fi
          done

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Build and push dumbodb image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.inputs.outputs.tags }}
          build-args: |
            DUMBODB_VERSION=${{ steps.inputs.outputs.version }}

      - name: Update Docker Hub README
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          repository: dolthub/dumbodb
          readme-filepath: ./docker/README.md
