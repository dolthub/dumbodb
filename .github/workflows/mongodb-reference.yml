name: MongoDB Reference Integration Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  mongodb-reference:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0.8
        ports:
          - 37017:27017
        options: >-
          --health-cmd "mongosh --port 27017 --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run MongoDB reference suite
        id: run-tests
        run: make mongodb-reference
        env:
          MONGO_HOST: 127.0.0.1
          MONGO_PORT: 37017

      - name: Check for unexpected failures
        run: |
          RESULTS_FILE=".runtime/mongodb-reference.txt"
          SKIPLIST_FILE="scripts/mongodb-reference-skiplist.txt"

          if [ ! -f "$RESULTS_FILE" ]; then
            echo "ERROR: Results file not found: $RESULTS_FILE"
            exit 1
          fi

          # Fail fast on build errors (these don't produce --- FAIL: lines)
          BUILD_FAILS=$(grep -E "^FAIL\s.*\[build failed\]" "$RESULTS_FILE" || true)
          if [ -n "$BUILD_FAILS" ]; then
            echo "=== BUILD FAILURES ==="
            echo "$BUILD_FAILS"
            exit 1
          fi

          # Extract top-level failing test names (strip subtest paths)
          FAILING=$(grep -E "^--- FAIL: " "$RESULTS_FILE" \
            | sed 's/^--- FAIL: \([^/ ]*\).*/\1/' \
            | sort -u || true)

          if [ -z "$FAILING" ]; then
            echo "All tests passed!"
            exit 0
          fi

          echo "=== Failing tests ==="
          echo "$FAILING"
          echo ""

          # Build a sorted list of skip-list entries (strip blanks and comments)
          SKIPLIST=$(grep -v '^\s*#' "$SKIPLIST_FILE" | grep -v '^\s*$' | sort -u || true)

          UNEXPECTED=""
          while IFS= read -r test; do
            if echo "$SKIPLIST" | grep -qxF "$test"; then
              echo "  EXPECTED (in skip list): $test"
            else
              UNEXPECTED="${UNEXPECTED}  ${test}"$'\n'
            fi
          done <<< "$FAILING"

          if [ -n "$UNEXPECTED" ]; then
            echo ""
            echo "=== UNEXPECTED FAILURES (not in skip list) ==="
            printf '%s' "$UNEXPECTED"
            echo ""
            echo "Add these tests to scripts/mongodb-reference-skiplist.txt if they are"
            echo "structurally expected, or fix the underlying issue."
            exit 1
          fi

          echo ""
          echo "All failures are known-expected. Action passed."

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mongodb-reference-results
          path: .runtime/mongodb-reference.txt
