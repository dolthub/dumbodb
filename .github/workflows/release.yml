name: Release Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build (e.g. v0.0.9)'
        required: true
        type: string

jobs:
  build-linux-amd64:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0  # full history for git describe

      - name: Verify tag exists
        if: github.event_name == 'workflow_dispatch'
        run: |
          if ! git tag -l "${{ inputs.tag }}" | grep -q .; then
            echo "::error::Tag '${{ inputs.tag }}' does not exist. Push the tag first: git tag ${{ inputs.tag }} && git push origin ${{ inputs.tag }}"
            exit 1
          fi

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Determine version
        id: version
        run: |
          VERSION=$(git describe --tags --always --dirty)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Install ICU
        # dumbodb pulls in github.com/dolthub/go-icu-regex transitively through
        # dolt, so every CGO-enabled build must link against
        # libicui18n / libicuuc / libicudata.
        run: sudo apt-get update && sudo apt-get install -y libicu-dev

      - name: Build linux/amd64
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build \
            -ldflags "-X github.com/dolthub/dumbodb/internal/version.GitVersion=${{ steps.version.outputs.version }}" \
            -o dist/dumbodb-linux-amd64 \
            ./cmd/dumbodb/

      - name: Upload linux/amd64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-amd64-binary
          path: dist/dumbodb-linux-amd64

  build-linux-arm64:
    # Native arm64 runner avoids the cross-compile / multiarch dance. The
    # previous attempt to cross-build from amd64 hit two issues -- the runner
    # image now uses deb822 sources (so the .list-targeted sed was a no-op
    # and the unmodified amd64 repos tried to serve arm64 packages and
    # 404'd) and CGo's link step needs an arm64 g++ rather than the host
    # gcc. Running on a real arm64 runner sidesteps both.
    runs-on: ubuntu-24.04-arm
    env:
      CGO_ENABLED: "1"

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Verify tag exists
        if: github.event_name == 'workflow_dispatch'
        run: |
          if ! git tag -l "${{ inputs.tag }}" | grep -q .; then
            echo "::error::Tag '${{ inputs.tag }}' does not exist. Push the tag first: git tag ${{ inputs.tag }} && git push origin ${{ inputs.tag }}"
            exit 1
          fi

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Determine version
        id: version
        run: |
          VERSION=$(git describe --tags --always --dirty)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Install ICU
        run: sudo apt-get update && sudo apt-get install -y libicu-dev

      - name: Build linux/arm64
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=arm64 go build \
            -ldflags "-X github.com/dolthub/dumbodb/internal/version.GitVersion=${{ steps.version.outputs.version }}" \
            -o dist/dumbodb-linux-arm64 \
            ./cmd/dumbodb/

      - name: Upload linux/arm64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64-binary
          path: dist/dumbodb-linux-arm64

  build-darwin:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Determine version
        id: version
        run: |
          VERSION=$(git describe --tags --always --dirty)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Install ICU
        # go-icu-regex needs ICU headers and libs (transitively via dolt). macOS
        # runners do not ship them on the toolchain search path -- install via
        # brew and point CGo at the cellar.
        run: brew install icu4c

      - name: Build darwin/arm64
        run: |
          mkdir -p dist
          ICU_PREFIX="$(brew --prefix icu4c)"
          export CGO_CPPFLAGS="-I${ICU_PREFIX}/include"
          export CGO_LDFLAGS="-L${ICU_PREFIX}/lib"
          export PKG_CONFIG_PATH="${ICU_PREFIX}/lib/pkgconfig"
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=1 go build \
            -ldflags "-X github.com/dolthub/dumbodb/internal/version.GitVersion=${{ steps.version.outputs.version }}" \
            -o dist/dumbodb-darwin-arm64 \
            ./cmd/dumbodb/

      - name: Upload darwin artifacts
        uses: actions/upload-artifact@v7
        with:
          name: darwin-binaries
          path: dist/dumbodb-*

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Determine version
        id: version
        run: |
          $VERSION = git describe --tags --always --dirty
          echo "version=$VERSION" >> $env:GITHUB_OUTPUT
          echo "Building version: $VERSION"

      # go-icu-regex's Windows support is MinGW-only (per its README). Install
      # the MinGW toolchain and ICU via msys2, then run the build inside the
      # msys2 shell so CC/CXX/etc. resolve to the MinGW binaries.
      - name: Set up MSYS2 / MinGW with ICU
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-icu
          update: false

      - name: Build windows/amd64
        shell: msys2 {0}
        run: |
          mkdir -p dist
          export GOOS=windows
          export GOARCH=amd64
          export CGO_ENABLED=1
          go build \
            -ldflags "-X github.com/dolthub/dumbodb/internal/version.GitVersion=${{ steps.version.outputs.version }}" \
            -o dist/dumbodb-windows-amd64.exe \
            ./cmd/dumbodb/

      - name: Upload windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-binaries
          path: dist/dumbodb-*

  release:
    needs: [build-linux-amd64, build-linux-arm64, build-darwin, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/dumbodb-*
          generate_release_notes: true
