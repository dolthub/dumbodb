name: Dongo FerretDB Scorecard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  scorecard:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and run FerretDB scorecard
        id: run-scorecard
        run: make ferretdb-scorecard
        continue-on-error: true  # structural failures are handled below; step failure = build/startup failure

      - name: Report pass percentage
        if: always()
        run: |
          RESULTS_FILE=".runtime/ferretdb-scorecard.txt"

          if [ ! -f "$RESULTS_FILE" ]; then
            echo "ERROR: Results file not found — dongo may have failed to start or build"
            exit 1
          fi

          # Count all test lines (top-level and subtests) by stripping leading whitespace
          PASS=$(grep -cE "^\s+--- PASS:|^--- PASS:" "$RESULTS_FILE" || true)
          FAIL=$(grep -cE "^\s+--- FAIL:|^--- FAIL:" "$RESULTS_FILE" || true)
          SKIP=$(grep -cE "^\s+--- SKIP:|^--- SKIP:" "$RESULTS_FILE" || true)
          TOTAL=$(( PASS + FAIL + SKIP ))

          if [ "$TOTAL" -gt 0 ]; then
            RATE=$(awk "BEGIN { printf \"%.1f\", ($PASS / $TOTAL) * 100 }")
          else
            RATE="0.0"
          fi

          echo ""
          echo "================================================"
          echo "  DONGO FERRETDB COMPATIBILITY SCORECARD"
          echo "================================================"
          printf "  Tests run     : %d\n" "$TOTAL"
          printf "  Tests passed  : %d\n" "$PASS"
          printf "  Tests failed  : %d\n" "$FAIL"
          printf "  Tests skipped : %d\n" "$SKIP"
          echo "  --------------------------------"
          printf "  PASS RATE: %d/%d (%s%%)\n" "$PASS" "$TOTAL" "$RATE"
          echo "================================================"
          echo ""

          if [ "$FAIL" -gt 0 ]; then
            echo "FAIL: $FAIL test(s) failed — CI is red until this reaches 0"
            exit 1
          fi

      - name: Check for test failures
        if: always()
        run: |
          RESULTS_FILE=".runtime/ferretdb-scorecard.txt"

          if [ ! -f "$RESULTS_FILE" ]; then
            echo "ERROR: Results file not found: $RESULTS_FILE"
            exit 1
          fi

          # Fail on Dongo startup/crash errors (these don't produce --- FAIL: lines)
          if grep -qE "^ERROR: Dongo" "$RESULTS_FILE"; then
            echo "=== Dongo failed to start or crashed ==="
            grep -A 30 "^ERROR: Dongo" "$RESULTS_FILE" || true
            exit 1
          fi

          # Fail fast on build errors (these don't produce --- FAIL: lines)
          BUILD_FAILS=$(grep -E "^FAIL\s.*\[build failed\]" "$RESULTS_FILE" || true)
          if [ -n "$BUILD_FAILS" ]; then
            echo "=== BUILD FAILURES ==="
            echo "$BUILD_FAILS"
            exit 1
          fi

          # Extract top-level failing test names (strip subtest paths)
          FAILING=$(grep -E "^--- FAIL: " "$RESULTS_FILE" \
            | sed 's/^--- FAIL: \([^/ ]*\).*/\1/' \
            | sort -u || true)

          if [ -z "$FAILING" ]; then
            echo "All tests passed!"
            exit 0
          fi

          echo "=== Failing tests ==="
          echo "$FAILING"
          echo ""

          # Structural exclusions: tests that require real auth/SASL infrastructure
          # not available in CI. These are the ONLY tests permanently excluded from
          # CI failure — they fail before exercising their logic because the CI
          # FerretDB instance has no auth server. This list must NOT grow beyond
          # genuine infrastructure limitations.
          STRUCTURAL_EXCLUSIONS="
          TestHelloIsMasterOpQuerySpeculative
          TestHelloOpQuerySASLSupportedMechs
          TestHelloSpeculative
          TestHelloWithSupportedMechs
          TestOpQuery
          TestOpQueryHello
          TestOpQueryIsMaster
          TestOpQueryIsMasterHelloOk
          TestSASLContinueErrors
          TestSASLContinueOpQueryErrors
          TestSASLStartErrors
          TestSASLStartOpQueryErrors
          "

          FAILING_NON_STRUCTURAL=""
          while IFS= read -r test; do
            if echo "$STRUCTURAL_EXCLUSIONS" | grep -qxF "          $test"; then
              echo "  STRUCTURAL (auth/SASL infra): $test"
            else
              FAILING_NON_STRUCTURAL="${FAILING_NON_STRUCTURAL}  ${test}"$'\n'
            fi
          done <<< "$FAILING"

          if [ -n "$FAILING_NON_STRUCTURAL" ]; then
            echo ""
            echo "=== FAILING TESTS (CI must be red until these are fixed) ==="
            printf '%s' "$FAILING_NON_STRUCTURAL"
            echo ""
            echo "Fix these failures. Only SASL/auth infrastructure tests may be"
            echo "structurally excluded — all other failures must be resolved."
            exit 1
          fi

          echo ""
          echo "Only structural auth/SASL failures — all fixable tests pass."

      - name: Upload scorecard artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ferretdb-scorecard
          path: .runtime/ferretdb-scorecard.txt
